<title>Golden Hog Hero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Game-HUD console: top bar (brand + persona switch) + left rail nav frame a main stage that
   swaps between Hero Dashboard / Quest Board / Leaderboard / Badges / Manager views. The reward
   bar that drains as a deadline approaches, and the XP/Level bar, are the two recurring motifs
   that carry the "RPG performance engine" idea through every screen. */
:root{
  color-scheme: dark;
  --bg:#0a0c13; --bg-2:#0d1019;
  --surface:#131726; --surface-2:#192038; --surface-3:#212a4a;
  --text:#f2f4fb; --text-2:#b7bdd6; --text-muted:#7b82a3;
  --border:rgba(255,255,255,0.09); --border-strong:rgba(255,255,255,0.18);
  --accent:#e8b84b; --accent-ink:#1a1304; --accent-soft:rgba(232,184,75,0.14);
  --xp:#45d3e6; --power:#ff8a4c;
  --good:#3ecf6e; --warn:#f5b942; --bad:#ef5959;
  --q-daily:#3ecf6e; --q-routine:#2dd4bf; --q-assigned:#4f8cff; --q-challenge:#b185f5; --q-boss:#ef5959;
  --shadow: 0 16px 36px rgba(0,0,0,0.45);
  --font-display: 'Exo 2', 'Segoe UI', sans-serif;
  --font-body: 'Be Vietnam Pro', 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#f3f4fa; --bg-2:#eceef7;
    --surface:#ffffff; --surface-2:#f3f4fb; --surface-3:#e7e9f6;
    --text:#13162a; --text-2:#454a6b; --text-muted:#787fa0;
    --border:rgba(15,18,40,0.10); --border-strong:rgba(15,18,40,0.20);
    --accent:#9a6f10; --accent-ink:#fffaf0; --accent-soft:rgba(154,111,16,0.12);
    --xp:#0d8fa3; --power:#c2600f;
    --good:#1f9a4e; --warn:#a56c00; --bad:#c23636;
    --shadow: 0 10px 26px rgba(20,16,50,0.10);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f3f4fa; --bg-2:#eceef7;
  --surface:#ffffff; --surface-2:#f3f4fb; --surface-3:#e7e9f6;
  --text:#13162a; --text-2:#454a6b; --text-muted:#787fa0;
  --border:rgba(15,18,40,0.10); --border-strong:rgba(15,18,40,0.20);
  --accent:#9a6f10; --accent-ink:#fffaf0; --accent-soft:rgba(154,111,16,0.12);
  --xp:#0d8fa3; --power:#c2600f;
  --good:#1f9a4e; --warn:#a56c00; --bad:#c23636;
  --shadow: 0 10px 26px rgba(20,16,50,0.10);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:var(--accent-ink)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.tabular{font-variant-numeric:tabular-nums}
.disp{font-family:var(--font-display)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.shell{min-height:100%;display:flex;flex-direction:column}
.gutter{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:16px;
  padding-block:10px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.brand-mark{width:32px;height:32px;flex:none}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:.3px}
.brand-tag{font-size:9.5px;color:var(--accent);letter-spacing:1.6px;text-transform:uppercase}
.demo-pill{font-size:10px;color:var(--text-muted);border:1px solid var(--border-strong);border-radius:999px;padding:3px 9px;white-space:nowrap}
.topbar-sp{flex:1}
.persona{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:5px 6px 5px 10px}
.persona label{font-size:10px;color:var(--text-muted)}
.persona select{background:none;border:none;outline:none;font-size:12.5px;font-weight:600}
.iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:16px;height:16px}

/* layout */
.layout{display:grid;grid-template-columns:216px minmax(0,1fr);gap:16px;flex:1;align-items:start;padding-block:16px}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.rail{position:sticky;top:calc(54px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px}
@media (max-width:860px){.rail{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}}
.rail-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;background:none;border:none;text-align:left;font-size:13px;color:var(--text-2);white-space:nowrap}
.rail-item svg{width:16px;height:16px;flex:none;color:var(--text-muted)}
.rail-item.is-active{background:var(--accent-soft);color:var(--accent)}
.rail-item.is-active svg{color:var(--accent)}
.rail-sep{height:1px;background:var(--border);margin:5px 6px}

.stage{min-width:0;display:flex;flex-direction:column;gap:16px}
.view[hidden]{display:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
.card-title{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}

/* hero header */
.hero{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--border-strong);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 85% -10%, var(--accent-soft), transparent 70%);pointer-events:none}
.hero-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.hero-ava{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--power));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--accent-ink);flex:none}
.hero-id{min-width:0;flex:1}
.hero-name{font-family:var(--font-display);font-weight:800;font-size:19px}
.hero-role{font-size:12px;color:var(--text-muted);margin-top:2px}
.hero-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lvlpill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700}
.rankpill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--text-2)}
.combopill{display:inline-flex;align-items:center;gap:5px;background:rgba(239,89,89,.14);color:var(--bad);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700}

.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
@media (max-width:640px){.statrow{grid-template-columns:repeat(2,1fr)}}
.stile{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.stile .l{font-size:10.5px;color:var(--text-muted)}
.stile .v{font-family:var(--font-display);font-size:19px;font-weight:700;margin-top:2px}
.stile.power .v{color:var(--power)}
.stile.kpi .v{color:var(--accent)}

.xpwrap{margin-top:16px}
.xpwrap .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:6px}
.bartrack{height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden;border:1px solid var(--border)}
.barfill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--xp),var(--accent))}

/* quest list */
.qlist{display:flex;flex-direction:column;gap:9px}
.qrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;text-align:left}
.qrow:hover{border-color:var(--border-strong)}
@media (max-width:640px){.qrow{grid-template-columns:auto 1fr;row-gap:6px}.qrow .qreward,.qrow .qstate{grid-column:2}}
.qtype{width:9px;align-self:stretch;border-radius:4px}
.qtype.daily{background:var(--q-daily)} .qtype.routine{background:var(--q-routine)} .qtype.assigned{background:var(--q-assigned)} .qtype.challenge{background:var(--q-challenge)} .qtype.boss{background:var(--q-boss)}
.qmain{min-width:0}
.qname{font-size:13px;font-weight:600}
.qmeta{font-size:11px;color:var(--text-muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.qtag{padding:1px 7px;border-radius:999px;background:var(--surface-3);font-size:10px}
.qreward{font-family:var(--font-display);font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.qstate{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;text-align:center}
.qstate.st-normal{background:rgba(62,207,110,.14);color:var(--good)}
.qstate.st-warn{background:rgba(245,185,66,.16);color:var(--warn)}
.qstate.st-crit{background:rgba(255,138,76,.16);color:var(--power)}
.qstate.st-over{background:rgba(239,89,89,.16);color:var(--bad)}
.qstate.st-submitted{background:rgba(177,133,245,.18);color:var(--q-challenge)}
.qstate.st-done{background:var(--accent-soft);color:var(--accent)}

.filters{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:11.5px;color:var(--text-2)}
.chip.is-active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

/* modal */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(5,6,12,0.6);display:flex;align-items:center;justify-content:center;padding:18px}
.modal-overlay[hidden]{display:none}
.modal-card{background:var(--surface);border:1px solid var(--border-strong);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:calc(100vh - 40px);overflow:auto;box-shadow:var(--shadow)}
.modal-card h3{font-family:var(--font-display);font-size:17px;margin:0 0 4px}
.modal-sub{font-size:11.5px;color:var(--text-muted);margin-bottom:14px}
.rewardtable{display:flex;flex-direction:column;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.rewardrow{display:flex;justify-content:space-between;padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--border)}
.rewardrow:last-child{border-bottom:none}
.rewardrow.total{background:var(--accent-soft);font-weight:700;color:var(--accent)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface-2);padding:9px 14px;font-size:12.5px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.good{background:var(--good);border-color:var(--good);color:#06240f}
.elink{background:none;border:none;padding:0;font:inherit;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:2px}
.elink:hover{text-decoration-color:currentColor}

/* leaderboard */
.lbtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.lbtabs::-webkit-scrollbar{display:none}
.lbrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;width:100%;background:none;border:none;text-align:left;cursor:pointer}
.lbrow:hover{background:var(--surface-2)}
.lbrow.me{background:var(--accent-soft)}
.lbrow .rk{font-family:var(--font-display);font-weight:800;color:var(--text-muted);text-align:center}
.lbrow:nth-child(1) .rk{color:#ffd454}
.lbrow:nth-child(2) .rk{color:#c8ccd8}
.lbrow:nth-child(3) .rk{color:#d4985c}
.lbname{font-size:12.5px;font-weight:600}
.lbrole{font-size:10.5px;color:var(--text-muted)}
.lbval{font-family:var(--font-display);font-weight:700;font-size:13px;white-space:nowrap}

/* badges */
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}
.badge.locked{opacity:.4}
.badge .bi{font-size:26px;margin-bottom:6px}
.badge .bn{font-size:11.5px;font-weight:700}
.badge .bd{font-size:10px;color:var(--text-muted);margin-top:3px}

/* levels */
.levelladder{display:flex;flex-direction:column;gap:2px}
.lvrow{display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px}
.lvrow.current{background:var(--accent-soft)}
.lvrow.passed{opacity:.55}
.lvrow .lv{font-family:var(--font-display);font-weight:800;color:var(--accent)}
.lvrow .lt{font-size:12.5px;font-weight:600}
.lvrow .lr{font-size:10.5px;color:var(--text-muted)}
.lvrow .lx{font-size:11px;color:var(--text-muted);text-align:right;white-space:nowrap}

/* boss quest */
.boss{background:linear-gradient(160deg, rgba(239,89,89,.12), var(--surface));border:1px solid rgba(239,89,89,.3);border-radius:18px;padding:16px}
.boss-title{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--bad)}
.boss-goal{font-size:12px;color:var(--text-2);margin-top:4px}
.depbars{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.deprow{display:grid;grid-template-columns:100px 1fr 60px;gap:10px;align-items:center;font-size:12px}
.deptrack{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.depfill{height:100%;border-radius:999px;background:var(--bad)}

/* team overview (manager) */
.teamrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.teamrow:last-child{border-bottom:none}
.wl{width:64px;height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.wlfill{height:100%}
.approverow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.approverow:last-child{border-bottom:none}
.approverow .ai{min-width:0;flex:1}
.approverow .an{font-size:12.5px;font-weight:600}
.approverow .am{font-size:11px;color:var(--text-muted);margin-top:2px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);padding:10px 16px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);z-index:150;opacity:0;transition:opacity .18s,transform .18s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{padding:28px 12px;text-align:center;color:var(--text-muted);font-size:12.5px}
</style>

<div class="shell">
  <header class="topbar gutter">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none"><path d="M16 2 4 8v9c0 7 5 11 12 13 7-2 12-6 12-13V8L16 2Z" stroke="var(--accent)" stroke-width="1.6"/><path d="M16 9l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L16 9Z" fill="var(--accent)" fill-opacity=".9"/></svg>
      <div>
        <div class="brand-name">GOLDEN HOG <span style="color:var(--accent)">HERO</span></div>
        <div class="brand-tag">Human Performance RPG</div>
      </div>
    </div>
    <div class="topbar-sp"></div>
    <span class="demo-pill" id="demoPill">Demo minh hoạ · dữ liệu mẫu</span>
    <div class="persona">
      <label>Xem như</label>
      <select id="personaSel"></select>
    </div>
    <button class="iconbtn" id="notifBtn" title="Thông báo" style="position:relative">🔔<span id="notifCount" style="position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:9px;border-radius:999px;min-width:14px;height:14px;line-height:14px;text-align:center;padding:0 2px"></span></button>
    <button class="iconbtn" id="themeBtn" title="Đổi giao diện sáng / tối"></button>
    <button class="iconbtn" id="resetBtn" title="Làm lại dữ liệu demo từ đầu">↺</button>
  </header>

  <div class="layout gutter">
    <nav class="rail" id="rail"></nav>

    <main class="stage">
      <section class="view" id="view-dashboard">
        <div class="hero" id="heroCard"></div>
        <div class="grid2">
          <div class="card">
            <div class="card-title"><span>Nhiệm vụ hôm nay</span><span id="todayCount"></span></div>
            <div class="qlist" id="todayQuests"></div>
          </div>
          <div class="card">
            <div class="card-title"><span>Đường lên cấp</span></div>
            <div class="levelladder" id="levelLadder"></div>
          </div>
        </div>
        <div class="boss" id="bossCard"></div>
      </section>

      <section class="view" id="view-company" hidden>
        <div class="card">
          <div class="card-title"><span>🏢 Golden Hog Performance Center</span></div>
          <div id="companyStats"></div>
        </div>
        <div class="grid2">
          <div class="card">
            <div class="card-title"><span>Xếp hạng phòng ban</span></div>
            <div id="companyDeptRank"></div>
          </div>
          <div class="card">
            <div class="card-title"><span>⚠️ Cảnh báo</span></div>
            <div id="companyAlerts"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title"><span>🏆 Top Performer</span></div>
          <div id="companyTop"></div>
        </div>
      </section>

      <section class="view" id="view-quests" hidden>
        <div class="card">
          <div class="card-title"><span>Toàn bộ nhiệm vụ</span><span id="questCount"></span></div>
          <div class="filters" id="questFilters" style="margin-bottom:12px"></div>
          <div class="qlist" id="allQuests"></div>
        </div>
      </section>

      <section class="view" id="view-leaderboard" hidden>
        <div class="card">
          <div class="card-title"><span>Bảng xếp hạng</span></div>
          <div class="lbtabs" id="lbTabs"></div>
          <div id="lbList"></div>
        </div>
      </section>

      <section class="view" id="view-badges" hidden>
        <div class="card">
          <div class="card-title"><span>Huy hiệu</span><span id="badgeCount"></span></div>
          <div class="badgegrid" id="badgeGrid"></div>
        </div>
      </section>

      <section class="view" id="view-approvals" hidden>
        <div class="card">
          <div class="card-title"><span>Báo cáo chờ duyệt</span><span id="pendingCount"></span></div>
          <div id="approvalList"></div>
        </div>
      </section>

      <section class="view" id="view-team" hidden>
        <div class="grid2">
          <div class="card">
            <div class="card-title"><span>Đội ngũ &amp; tải công việc</span></div>
            <div id="teamList"></div>
          </div>
          <div class="card">
            <div class="card-title"><span>Lực chiến theo Team</span></div>
            <div id="teamPower"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal-card" id="modalCard"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20261030);
const pick = arr => arr[Math.floor(rnd()*arr.length)];
const intBetween = (a,b) => Math.round(a + rnd()*(b-a));

/* ---------------- mục XLI/LVII "Rule Engine" — Ban giám đốc đổi được chính sách mà KHÔNG cần sửa code ----------------

/* ---------------- interconnect: 1 cơ chế mở thực thể dùng chung cho toàn trang ----------------
   data-kind="quest|employee|team|dept|badge" + data-id="..." => openEntity() mở đúng modal.
   data-view="<tên view>" => chuyển rail sang view đó (vd bấm "Xếp hạng #7" nhảy sang Bảng xếp hạng).
   Gọi wireInteractive(host) sau MỌI lần set innerHTML có chứa 2 loại thuộc tính trên. */
let modalStack = [];
let currentModal = null;
function openEntity(kind, id, fromModal){
  const overlay = document.getElementById('modalOverlay');
  if(fromModal && currentModal && !overlay.hidden) modalStack.push(currentModal);
  else modalStack = [];
  if(kind==='quest') openQuestModal(id);
  else if(kind==='employee') openEmployeeModal(id);
  else if(kind==='team') openTeamModal(id);
  else if(kind==='dept') openDeptModal(id);
  else if(kind==='badge') openBadgeModal(id);
}
function modalBack(){
  const prev = modalStack.pop();
  if(!prev){ closeModal(); return; }
  if(prev.kind==='quest') openQuestModal(prev.id);
  else if(prev.kind==='employee') openEmployeeModal(prev.id);
  else if(prev.kind==='team') openTeamModal(prev.id);
  else if(prev.kind==='dept') openDeptModal(prev.id);
  else if(prev.kind==='badge') openBadgeModal(prev.id);
}
function backBtnHtml(){ return modalStack.length ? '<button class="btn" id="mBack">◀ Quay lại</button>' : ''; }
function wireInteractive(host, opts){
  if(!host) return;
  const fromModal = !!(opts && opts.fromModal);
  host.querySelectorAll('[data-kind]').forEach(el=>{
    el.addEventListener('click', e=>{ e.stopPropagation(); openEntity(el.getAttribute('data-kind'), el.getAttribute('data-id'), fromModal); });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); openEntity(el.getAttribute('data-kind'), el.getAttribute('data-id'), fromModal); } });
  });
  host.querySelectorAll('[data-view]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.view = el.getAttribute('data-view'); closeModal(); syncViews(); renderAll(); });
  });
}

/* ---------------- số liệu nền (lịch sử trước khi dùng hệ thống) — từ đây mọi thao tác thật sẽ cộng dồn lên trên nền này ---------------- */

/* ---------------- công thức thật theo đề xuất (mục 3 POWER, mục 10 Combo, mục IV Badge) —
   mỗi nhân viên = nền lịch sử (seedBase) + lịch sử thao tác thật (history) phát sinh khi dùng demo */
// mục XIV đề xuất: 5→×1.05, 10→×1.10, 20→×1.15, 30→×1.20 (trần +20%) — trễ 1 Quest là reset combo
// Đọc từ CONFIG.comboTiers (Ban giám đốc đổi được qua ⚙️ Cấu hình hệ thống, không cần sửa code)
function comboMultiplier(combo){
  const tiers = (CONFIG.comboTiers||DEFAULT_CONFIG.comboTiers).slice().sort((a,b)=>b.n-a.n);
  for(const t of tiers){ if(combo>=t.n) return t.m; }
  return 1;
}
function previewOnTime(q){
  if(q.status==='submitted'||q.status==='support_requested') return q.submittedAt ? (q.submittedAt<=q.due) : true;
  return (q.due-NOW)>=0;
}
// mục XV "Perfect Quest": 1★ hoàn thành · 2★ đúng hạn · 3★ đúng hạn + không lỗi (đạt lần đầu) · 4★ vượt yêu cầu · 5★ vượt yêu cầu + đúng hạn + đạt lần đầu
function starsFor(onTime, firstTry, excel){
  if(excel) return (onTime && firstTry) ? 5 : 4;
  if(onTime && firstTry) return 3;
  if(onTime) return 2;
  return 1;
}
// Nguyên tắc 4 + mục XIX "Chống cày KPI": 1 Quest nhỏ (daily) không được tính ngang 1 Quest lớn (boss) trong Task Performance —
// trọng số theo khung điểm của từng loại (so với mức giữa của Assigned Quest làm gốc), lấy từ CONFIG nên Admin đổi khung điểm là đổi luôn trọng số.
function taskWeight(type){
  const r = (CONFIG.qtypeRange||DEFAULT_CONFIG.qtypeRange)[type] || [50,150];
  const base = (CONFIG.qtypeRange||DEFAULT_CONFIG.qtypeRange).assigned || [50,150];
  return ((r[0]+r[1])/2) / ((base[0]+base[1])/2);
}
function computeAward(q, emp, onTime, excel){
  const b = q.base;
  const base = rewardNow(q);
  const onTimeBonus = onTime ? Math.round(b*0.1) : 0;
  const qualityBonus = !q.wasReturned ? Math.round(b*0.1) : 0;
  const excelBonus = excel ? Math.round(b*0.2) : 0;
  let gain = base + onTimeBonus + qualityBonus + excelBonus;
  if(emp && gain>0 && onTime) gain = Math.round(gain*comboMultiplier(emp.combo));
  return gain;
}
function recomputeStats(e){
  const sb = e.seedBase;
  const completed = e.history.filter(h=>h.outcome==='completed');
  const returned = e.history.filter(h=>h.outcome==='returned');
  const liveOnTime = completed.filter(h=>h.onTime).length;
  const liveFirstTry = completed.filter(h=>h.firstTry).length;
  const totalN = sb.questsDone + completed.length;
  const onTimePct = totalN ? Math.round((sb.questsDone*(sb.onTime/100) + liveOnTime) / totalN * 100) : sb.onTime;
  const qualityPct = totalN ? Math.round((sb.questsDone*(sb.quality/100) + liveFirstTry) / totalN * 100) : sb.quality;
  let combo = sb.combo;
  if(completed.length){ combo = 0; for(let i=completed.length-1;i>=0;i--){ if(completed[i].onTime) combo++; else break; } }
  const xp = sb.xp + e.history.reduce((s,h)=>s+(h.xpGained||0),0);
  const lvl = levelForXp(xp);
  const openCount = QUESTS.filter(q=>q.owner===e.id && (q.status==='new'||q.status==='submitted'||q.status==='support_requested')).length;
  const workload = Math.max(0, Math.min(100, sb.workload + openCount*6 - completed.length*2));
  // taskPerf tính theo TRỌNG SỐ giá trị việc (không phải đếm đầu việc) — làm 1 Boss Quest không thể bị 1 Daily Quest "cày" cho ngang bằng
  const liveWeighted = completed.reduce((s,h)=>s+taskWeight(h.type),0);
  const totalWeighted = sb.questsDone*1 + liveWeighted; // nền lịch sử cũ không có chi tiết loại → coi trọng số 1 (ngang Assigned Quest)
  const taskPerf = Math.min(100, Math.round(totalWeighted/1.5));
  // mục XLVI/XXI: mỗi lần bị trả lại (returned) coi là 1 vi phạm nhỏ, trừ dần điểm Kỷ luật
  const discipline = Math.max(0, 100 - returned.length*10);
  const badgeSet = new Set(sb.badges);
  if(totalN>=5 && onTimePct>=95) badgeSet.add('speed');
  if(totalN>=5 && qualityPct>=95) badgeSet.add('quality');
  if(combo>=5) badgeSet.add('daily');
  if(completed.some(h=>h.type==='challenge'||h.type==='boss')) badgeSet.add('profit');
  if(sb.kpi>=90) badgeSet.add('farm');
  if(returned.length===0) badgeSet.add('discipline');
  if(badgeSet.size>=7) badgeSet.add('legend');
  const skillPct = Math.min(100, Math.round(badgeSet.size/BADGES.length*100));
  const power = Math.round((0.3*taskPerf + 0.2*onTimePct + 0.2*qualityPct + 0.2*sb.kpi + 0.1*skillPct) * 100);
  // mục XX "KPI tháng" — công thức RIÊNG, khác Power: 40% hoàn thành việc + 20% đúng hạn + 20% chất lượng + 20% kết quả (sb.kpi dùng làm gốc "kết quả" vì demo chưa nối số liệu sản xuất/tài chính thật)
  const kpiMonth = Math.round(0.4*taskPerf + 0.2*onTimePct + 0.2*qualityPct + 0.2*sb.kpi);
  Object.assign(e, { xp, level:lvl.lv, kpi:kpiMonth, onTime:onTimePct, quality:qualityPct, combo, questsDone:totalN, workload, power, discipline, badges:Array.from(badgeSet) });
}
function teamScore(teamId){
  const members = EMPLOYEES.filter(e=>e.team===teamId);
  if(!members.length) return 0;
  const avg = k => members.reduce((s,e)=>s+e[k],0)/members.length;
  const completionRate = Math.min(100, Math.round(avg('questsDone')/1.2));
  const discipline = Math.max(0, 100 - members.reduce((s,e)=>s+e.history.filter(h=>h.outcome==='returned').length,0)*5);
  return Math.round(0.3*avg('kpi') + 0.25*completionRate + 0.2*avg('onTime') + 0.15*avg('quality') + 0.1*discipline);
}
function recomputeBoss(){
  BOSS.deps.forEach(d=>{ d.done = d.seedDone; });
  EMPLOYEES.forEach(e=>{
    const d = BOSS.deps.find(x=>x.name===e.dept);
    if(!d) return;
    const bossXp = e.history.filter(h=>h.outcome==='completed' && h.type==='boss').reduce((s,h)=>s+h.xpGained,0);
    d.done += Math.round(bossXp/10);
  });
}
function recomputeAll(){
  EMPLOYEES.forEach(recomputeStats);
  EMPLOYEES.sort((a,b)=>b.power-a.power);
  EMPLOYEES.forEach((e,i)=> e.rank = i+1);
  TEAMS.forEach(t=>{
    const members = EMPLOYEES.filter(e=>e.team===t.id);
    t.power = members.length ? Math.round(members.reduce((s,e)=>s+e.power,0)/members.length) : t.power;
    t.score = teamScore(t.id);
  });
  if(typeof BOSS!=='undefined') recomputeBoss();
}

// mục VI.16 "Lịch sử thao tác" — mọi hành động quan trọng trên 1 Quest phải lưu lại, không xoá dấu vết (mục XXXII)
function logQ(q, msg){ q.log = q.log||[]; q.log.unshift({ msg, ts:new Date().toISOString() }); }
// mục IX: trạng thái thời gian tính theo % THỜI GIAN CÒN LẠI so với tổng thời hạn của Quest (không dùng giờ tuyệt đối)
// — để 1 Quest hạn 2 giờ (daily) và 1 Quest hạn 10 ngày (boss) cùng tuân 1 thang đo công bằng như nhau.
function timeFrac(q, atTime){
  const total = q.due - q.createdAt;
  if(total<=0) return 0;
  return Math.max(0, Math.min(1, (q.due - atTime)/total));
}

function todayStr(){ return NOW.getFullYear()+'-'+String(NOW.getMonth()+1).padStart(2,'0')+'-'+String(NOW.getDate()).padStart(2,'0'); }

function genDailyQuestsForDate(dateStr){

}

function questState(q){
  if(q.status==='submitted') return {key:'submitted', label:'SUBMITTED — chờ duyệt'};
  if(q.status==='support_requested') return {key:'warn', label:'🆘 CHỜ QUẢN LÝ XỬ LÝ'};
  if(q.status==='completed') return {key:'done', label:'COMPLETED'};
  if(q.status==='returned') return {key:'warn', label:'RETURNED — làm lại'};
  const hoursLeft = (q.due - NOW)/3600000;
  if(hoursLeft < 0) return {key:'over', label:'OVERDUE'};
  const frac = timeFrac(q, NOW);
  const dc = CONFIG.decay||DEFAULT_CONFIG.decay;
  if(frac < dc.critFrac) return {key:'crit', label:'NEAR DEADLINE'};   // mục IX: CRITICAL — còn dưới X% thời gian (Admin cấu hình)
  if(frac < dc.warnFrac) return {key:'warn', label:'IN PROGRESS'};      // mục IX: WARNING — còn dưới X% thời gian
  return {key:'normal', label:'NEW'};
}
function latePenaltyFor(lateH, base){
  const tiers = (CONFIG.latePenalty||DEFAULT_CONFIG.latePenalty).slice().sort((a,b)=>b.h-a.h);
  for(const t of tiers){ if(lateH>=t.h) return -Math.min(t.p, base); }
  return 0;
}
function rewardNow(q){
  if(q.status==='completed') return q.base;
  const refTime = (q.status==='submitted'||q.status==='support_requested') ? (q.submittedAt||NOW) : NOW;
  const hoursLeft = (q.due - refTime)/3600000;
  if(hoursLeft < 0){
    if(q.protected) return 0;
    return latePenaltyFor(-hoursLeft, q.base);
  }
  // mục X: còn ít thời gian → giảm % thưởng — tính theo % thời gian còn lại, không theo giờ tuyệt đối. Ngưỡng/mức % lấy từ CONFIG.
  const frac = timeFrac(q, refTime);
  const dc = CONFIG.decay||DEFAULT_CONFIG.decay;
  if(frac < dc.critFrac) return Math.round(q.base*dc.critMult);
  if(frac < dc.warnFrac) return Math.round(q.base*dc.warnMult);
  return q.base;
}
function dueText(q){
  const hoursLeft = (q.due - NOW)/3600000;
  if(q.status==='submitted') return 'Đã nộp — chờ quản lý duyệt';
  if(q.status==='support_requested') return 'Đã xin hỗ trợ: "'+(q.supportReason||'')+'"';
  if(q.status==='completed') return 'Đã hoàn thành';
  if(hoursLeft<0) return 'Trễ '+fmtNum(-hoursLeft)+' giờ';
  if(hoursLeft<48) return 'Còn '+fmtNum(hoursLeft)+' giờ';
  return 'Còn '+fmtNum(hoursLeft/24)+' ngày';
}

    const emp = EMPLOYEES.find(e=>e.id===q.owner);
    if(emp){ emp.history.push({ qid:q.id, type:q.type, outcome:'returned', ts:new Date().toISOString() }); recomputeAll(); }
    saveState(); closeModal(); renderAll(); notify('🔄 Quest Returned — "'+q.name+'" cần bổ sung.');
  });
  bind('mApprove', ()=>{
    const emp = EMPLOYEES.find(e=>e.id===q.owner);
    const onTime = previewOnTime(q);
    const excelChk = document.getElementById('mExcel');
    const excel = !!(excelChk && excelChk.checked);
    const gain = computeAward(q, emp, onTime, excel);
    const firstTry = !q.wasReturned;
    const stars = starsFor(onTime, firstTry, excel);
    q.status='completed'; q.resolvedAt=new Date(); q.excel=excel; q.stars=stars;
    logQ(q, 'Quản lý duyệt — '+(gain>=0?'+':'')+gain+' XP, '+stars+'★');
    const prevLevel = emp ? emp.level : null;
    const prevBadges = emp ? emp.badges.slice() : [];
    if(emp){ emp.history.push({ qid:q.id, type:q.type, outcome:'completed', onTime, firstTry, stars, xpGained:gain, ts:new Date().toISOString() }); recomputeAll(); }
    saveState(); closeModal(); renderAll();
    notify('✅ Quest Completed — '+(emp?emp.name:'')+' '+(gain>=0?'+':'')+gain+' XP'+(onTime && emp && comboMultiplier(emp.combo)>1 ? ' (có Combo 🔥)':''));
    if(emp && emp.level>prevLevel) notify('🆙 '+emp.name+' LÊN LEVEL '+emp.level+'!');
    if(emp) emp.badges.forEach(bid=>{ if(!prevBadges.includes(bid)){ const b=BADGES.find(x=>x.id===bid); notify('🏆 '+emp.name+' đạt huy hiệu mới: '+(b?b.icon+' '+b.name:bid)); } });
  });
  bind('mRsvExtend', ()=>reRender('resolve:extend'));
  bind('mRsvReassign', ()=>reRender('resolve:reassign'));
  bind('mRsvHelper', ()=>reRender('resolve:helper'));
  bind('mExt24', ()=>{ const oldDue=q.due; q.due=new Date(q.due.getTime()+24*3600000); q.status='new'; q.protected=true; logQ(q,'Quản lý gia hạn +24 giờ (hạn cũ: '+oldDue.toLocaleString('vi-VN')+' → hạn mới: '+q.due.toLocaleString('vi-VN')+')'); saveState(); closeModal(); renderAll(); notify('⏳ Đã gia hạn 24 giờ — không bị phạt.'); });
  bind('mExt48', ()=>{ const oldDue=q.due; q.due=new Date(q.due.getTime()+48*3600000); q.status='new'; q.protected=true; logQ(q,'Quản lý gia hạn +48 giờ (hạn cũ: '+oldDue.toLocaleString('vi-VN')+' → hạn mới: '+q.due.toLocaleString('vi-VN')+')'); saveState(); closeModal(); renderAll(); notify('⏳ Đã gia hạn 48 giờ — không bị phạt.'); });
  bind('mConfirmPick', ()=>{
    const sel = document.getElementById('mPickEmp');
    const pickId = sel && sel.value;
    const pickName = (EMPLOYEES.find(e=>e.id===pickId)||{}).name||'';
    if(mode==='resolve:reassign'){
      const oldOwnerName = (EMPLOYEES.find(e=>e.id===q.owner)||{}).name||'';
      logQ(q,'Quản lý chuyển nhiệm vụ: '+oldOwnerName+' → '+pickName);
      if(pickId) q.owner = pickId; q.status='new'; q.protected=true; recomputeAll(); saveState(); closeModal(); renderAll(); notify('🔁 Đã chuyển nhiệm vụ — không bị phạt.');
    } else {
      logQ(q,'Quản lý thêm người hỗ trợ: '+pickName);
      q.helperId = pickId; q.status='new'; q.protected=true; saveState(); closeModal(); renderAll(); notify('🤝 Đã thêm người hỗ trợ — không bị phạt.');
    }
  });
  wireInteractive(card, {fromModal:true});
}

  document.getElementById('aqConfirm').addEventListener('click', ()=>{

    const hrs = parseInt(document.getElementById('aqDue').value,10);

    notify('🎯 Quest mới: "'+nm+'" giao cho '+(EMPLOYEES.find(e=>e.id===own)||{}).name+'.');

/* ---------------- lưu tiến trình thật (localStorage — mỗi trình duyệt giữ riêng) ---------------- */
const STORE_KEY = 'ghhero-state-v3';
function serializeState(){
  return {
    personaId: state.personaId, qseq,
    quests: QUESTS.map(q=>Object.assign({}, q, {
      due: q.due.toISOString(),
      createdAt: q.createdAt ? q.createdAt.toISOString() : null,
      submittedAt: q.submittedAt ? q.submittedAt.toISOString() : null,
      resolvedAt: q.resolvedAt ? q.resolvedAt.toISOString() : null,
      supportAskedAt: q.supportAskedAt ? q.supportAskedAt.toISOString() : null
    })),
    histories: EMPLOYEES.map(e=>({ id:e.id, history:e.history }))
  };
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(serializeState())); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.quests)) return false;
    QUESTS.length = 0;
    d.quests.forEach(q=> QUESTS.push(Object.assign({}, q, {
      due: new Date(q.due),
      createdAt: q.createdAt ? new Date(q.createdAt) : NOW,
      submittedAt: q.submittedAt ? new Date(q.submittedAt) : null,
      resolvedAt: q.resolvedAt ? new Date(q.resolvedAt) : null,
      supportAskedAt: q.supportAskedAt ? new Date(q.supportAskedAt) : null
    })));
    (d.histories||[]).forEach(h=>{ const e = EMPLOYEES.find(x=>x.id===h.id); if(e) e.history = h.history||[]; });
    if(d.personaId && EMPLOYEES.find(e=>e.id===d.personaId)) state.personaId = d.personaId;
    if(d.qseq) qseq = Math.max(qseq, d.qseq);
    return true;
  }catch(e){ return false; }
}

/* ---------------- mục XXXV: Dashboard Ban lãnh đạo — tổng công ty, drill-down Công ty → Phòng → Team → Nhân viên ---------------- */
function renderCompanyDashboard(){
  const n = EMPLOYEES.length;
  const avg = k => Math.round(EMPLOYEES.reduce((s,e)=>s+e[k],0)/n);
  const totalPower = EMPLOYEES.reduce((s,e)=>s+e.power,0);
  const overdueCount = QUESTS.filter(q=>q.status!=='completed' && questState(q).key==='over').length;
  const pendingCount = QUESTS.filter(q=>q.status==='submitted'||q.status==='support_requested').length;
  const totalQ = Math.max(1, QUESTS.length);
  const completedPct = Math.round(QUESTS.filter(q=>q.status==='completed').length / totalQ * 100);
  const overduePct = Math.round(overdueCount/totalQ*100);
  function tile(l,v){ return '<div class="stile"><div class="l">'+l+'</div><div class="v tabular">'+v+'</div></div>'; }
  document.getElementById('companyStats').innerHTML =
    '<button class="btn" id="btnAdminCfg" style="margin-bottom:12px">⚙️ Cấu hình hệ thống (Rule Engine)</button>'+
    '<div class="statrow" style="grid-template-columns:repeat(4,1fr)">'+
      tile('🎯 KPI công ty', avg('kpi')+'%')+tile('⚔️ Power tổng', fmtNum(totalPower))+
      tile('✅ Hoàn thành', completedPct+'%')+tile('🔴 Quá hạn', overduePct+'%')+
    '</div>'+
    '<div class="statrow" style="grid-template-columns:repeat(3,1fr);margin-top:10px">'+
      tile('⚡ Đúng hạn TB', avg('onTime')+'%')+tile('🎯 Chất lượng TB', avg('quality')+'%')+tile('🟠 Đang chờ duyệt', pendingCount+' việc')+
    '</div>';
  const btnAdmin = document.getElementById('btnAdminCfg');
  if(btnAdmin) btnAdmin.addEventListener('click', openAdminModal);

  const byDept = DEPARTMENTS.map(d=>{
    const members = EMPLOYEES.filter(e=>e.dept===d);
    const avgPower = members.length? Math.round(members.reduce((s,e)=>s+e.power,0)/members.length):0;
    const avgKpiD = members.length? Math.round(members.reduce((s,e)=>s+e.kpi,0)/members.length):0;
    return {d, avgPower, avgKpiD, n:members.length};
  }).sort((a,b)=>b.avgPower-a.avgPower);
  document.getElementById('companyDeptRank').innerHTML = byDept.map((x,i)=>
    '<button type="button" class="teamrow" style="width:100%;background:none;border:none;text-align:left" data-kind="dept" data-id="'+x.d+'"><span>#'+(i+1)+' '+x.d+' <span style="color:var(--text-muted);font-size:11px">· '+x.n+' người · KPI '+x.avgKpiD+'%</span></span><span class="tabular" style="font-weight:700">'+fmtNum(x.avgPower)+'</span><span></span></button>'
  ).join('');

  const highLoad = EMPLOYEES.filter(e=>e.workload>90).length;
  const lowKpiDept = byDept.filter(x=>x.n && x.avgKpiD<70).length;
  const alerts = [];
  if(overdueCount) alerts.push('🔴 '+overdueCount+' nhiệm vụ quá hạn');
  if(pendingCount) alerts.push('🟠 '+pendingCount+' báo cáo đang chờ duyệt');
  if(highLoad) alerts.push('🟡 '+highLoad+' nhân viên workload &gt;90%');
  if(lowKpiDept) alerts.push('🔴 '+lowKpiDept+' phòng có KPI &lt;70%');
  // mục XLVI "Phát hiện bất thường": nhiệm vụ trùng tên (nghi chia nhỏ để cày điểm) + 1 lần duyệt cộng XP bất thường lớn
  const dupGroups = {};
  QUESTS.filter(q=>q.status!=='completed').forEach(q=>{ const k=q.owner+'|'+q.name; dupGroups[k]=(dupGroups[k]||0)+1; });
  const dupCount = Object.values(dupGroups).filter(n=>n>=3).length;
  if(dupCount) alerts.push('🟡 '+dupCount+' trường hợp nhiệm vụ trùng tên lặp lại ≥3 lần — nghi chia nhỏ việc để cày điểm');
  let bigJump = 0;
  EMPLOYEES.forEach(e=> e.history.forEach(h=>{ const typeMax = (CONFIG.qtypeRange[h.type]||[0,999999])[1]; if((h.xpGained||0) > typeMax*1.2) bigJump++; }));
  if(bigJump) alerts.push('🟡 '+bigJump+' lượt cộng điểm vượt xa khung điểm loại nhiệm vụ — nên kiểm tra lại');
  document.getElementById('companyAlerts').innerHTML = alerts.length ? alerts.map(a=>'<div class="modal-sub" style="font-size:12.5px;margin-bottom:6px">'+a+'</div>').join('') : '<div class="empty">Không có cảnh báo nào 🎉</div>';

  const top5 = EMPLOYEES.slice(0,5);
  document.getElementById('companyTop').innerHTML = top5.map((e,i)=>
    '<button type="button" class="teamrow" style="width:100%;background:none;border:none;text-align:left" data-kind="employee" data-id="'+e.id+'"><span>#'+(i+1)+' '+e.name+' <span style="color:var(--text-muted);font-size:11px">· '+e.dept+'</span></span><span class="tabular" style="font-weight:700;color:var(--power)">'+fmtNum(e.power)+'</span><span></span></button>'
  ).join('');

  wireInteractive(document.getElementById('companyDeptRank'));
  wireInteractive(document.getElementById('companyTop'));
}
